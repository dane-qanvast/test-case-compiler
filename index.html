  <script>
    // Shim window.storage to use localStorage. Mirrors the async API shape the
    // component expects: get → {value} | null, set → {value}, delete → {deleted},
    // list → {keys}.
    (function () {
      if (window.storage) return;
      const PREFIX = 'tcr_';
      window.storage = {
        async get(key) {
          const v = localStorage.getItem(PREFIX + key);
          return v === null ? null : { key, value: v };
        },
        async set(key, value) {
          localStorage.setItem(PREFIX + key, value);
          return { key, value };
        },
        async delete(key) {
          localStorage.removeItem(PREFIX + key);
          return { key, deleted: true };
        },
        async list(prefix) {
          const fullPrefix = PREFIX + (prefix || '');
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(fullPrefix)) keys.push(k.substring(PREFIX.length));
          }
          return { keys };
        }
      };
    })();
  </script>

// Prompt for users to paste into Claude/ChatGPT to generate a CSV that fits this app's schema.
const CSV_GENERATION_PROMPT = `You are generating a User Acceptance Testing (UAT) plan as a CSV file. The CSV will be reviewed by non-technical stakeholders (product owners, QA, business users) and executed manually by testers. Follow the rules below exactly. Consistency across UAT sheets matters more than cleverness — these conventions exist so any tester on any team can pick up the sheet and execute it without translation.

## OUTPUT FORMAT

Output ONE CSV file and nothing else — no preamble, no explanation, no markdown fences. The first row is the header, exactly:

Module,Test ID,Test Case,Persona,Steps,Expected Result,Pre-conditions,Status,Tested By,Notes

Every subsequent row is one test case. CSV rules:
- Comma-separated. Quote any field that contains a comma, newline, or double quote.
- Inside quoted fields, escape double quotes by doubling them (\`""\`).
- Newlines inside Steps / Expected Result / Pre-conditions cells are real newline characters inside the quoted field. Multi-line cells are normal — Steps almost always spans multiple lines.
- Leave Status, Tested By, and Notes EMPTY (trailing commas on every row). Those are filled in by testers, not by the author.

## COLUMN DEFINITIONS

**Module** — A phase/epic/feature-area label in ALL CAPS, using an em-dash (\`—\`) separator. Format: \`<PHASE OR RELEASE> — <FEATURE AREA>\`, optionally with a ticket/spec code: \`<PHASE> — <TICKET-CODE> <FEATURE AREA>\`. Examples of the shape (not the content — substitute your own):
- \`PHASE 2 — USER ONBOARDING\`
- \`RELEASE 4.1 — PAYMENTS\`
- \`SPRINT 12 — AUTH-204 SSO LOGIN\`
- \`V2 — NOTIFICATIONS MATRIX\`
Group related tests under the same Module value across consecutive rows; do not skip back and forth.

**Test ID** — \`TC-<n>\` starting at TC-1 and incrementing sequentially across the entire sheet (does NOT reset per module). If the requester supplies a starting number, continue from there.

**Test Case** — A one-line title (no period at the end) that names WHAT is being verified, not how. Be specific and dense:
- Good: \`Read-only role sees dashboard but cannot click "Edit"\`
- Good: \`Per-tenant numbering — independent invoice sequences\`
- Good: \`Picker shows in checkout dialog + persists chosen option\`
- Bad: \`Test that the dashboard is read-only\` (verbose, says "test that")
- Use \`→\` for sequence, \`+\` to join multiple verified things in one test, \`—\` (em-dash) to attach a qualifier or scope. Reference spec/ticket codes (NF5, AUTH-204, E2) when relevant.

**Persona** — Who performs the test. Use the role label, or a real test account name when one is established for that role in your APP CONTEXT. Combine with \`&\` when a test crosses roles (e.g. \`Admin & Member\`). If specific test accounts exist (e.g. "Alice = Admin"), name them inside Steps, but keep Persona at the role level.

**Steps** — A numbered list, one step per line, beginning each line with \`<n>. \` (digit, period, space). Style rules:
- Imperative voice: \`Click\`, \`Open\`, \`Toggle\`, \`Pick\`, \`Confirm\`. Never \`You should click\`.
- Concrete UI paths use \`→\` between breadcrumbs: \`Settings → Team → Members → "Invite"\`.
- Quote literal UI text in double quotes (which become \`""\` in the CSV cell): the button label, toggle label, dropdown value, banner text.
- Reference values explicitly: \`Set prefix to "TEST-"\`, \`Set date 1-2 minutes in the future\`.
- Inline edge-case probes count as steps: \`Try to delete the only admin. Confirm BLOCKED with clear error.\`
- Negative sanity checks go at the end with a \`Sanity check:\` prefix when verifying that something does NOT happen in a related context (e.g. single-tenant app shows no picker).
- Tests that chain off another test reference it directly: \`(uses TC-2 setup)\`, \`Open record from TC-7\`.

**Expected Result** — Prose, not a list. Describe the observable outcome in 1–3 sentences. Style rules:
- Lead with the success state, then qualifying detail.
- When a step has multiple branches (ON/OFF, A/B, default/non-default), cover each: \`With flag ON: redirects to onboarding. With OFF: redirects to dashboard.\`
- Use SHOUTY caps sparingly for emphasis on critical invariants: \`BLOCKED\`, \`ALWAYS\`, \`NOT changed retroactively\`, \`regardless of toggle\`.
- Quote literal UI strings the tester should see (banner copy, button text, toast text, error messages).
- Reference recently-fixed bugs when relevant: \`(recently fixed bug)\` or \`(regression check)\`.

**Pre-conditions** — Compact. Name the test accounts/data/feature flags needed, separated by \`.\` or \`+\`. Examples of the shape:
- \`Admin account.\`
- \`Admin + Member accounts.\`
- \`Multi-tenant workspace with distinct billing per tenant.\`
- \`Admin. At least one existing record of type X.\`
- \`Feature flag "new_checkout" enabled.\`
If the test itself sets up state for later tests, say so: \`Workspace without a 2nd tenant yet — this test sets one up.\`

**Status, Tested By, Notes** — Always blank. Three trailing commas at the end of every row.

## CONTENT RULES

1. **One test = one verifiable behavior.** If you're tempted to write \`and also verify X\` for an unrelated check, that's a second test case. Combining is allowed when the checks share setup and flow (e.g. "matrix renders + toggle persists + drawer opens" in one test because they're inspected in the same session).

2. **Cover the negative path.** When a feature has a guard (refusal, disabled button, hidden control, blocked action, validation error), add a step that probes it and an Expected Result line that names the guard. Example: \`Try to delete the only admin. Confirm BLOCKED with clear error.\`

3. **Cover the toggle/branch matrix.** When a feature is toggled or has variants, write steps for BOTH states (ON and OFF, default and non-default, free and paid, single-tenant and multi-tenant) within the same test if they share setup, otherwise as adjacent tests.

4. **Cross-surface verification when relevant.** For features that touch multiple surfaces (in-app + PDF + email + public page + API response), list each surface as a step and require the Expected Result to confirm consistency across all of them.

5. **Reference ticket/spec codes inline** when the test maps to a known spec item — include them in either the Test Case title or as a prefix.

6. **Use placeholders with angle brackets** when the exact value is dynamic: \`<User Name>\`, \`<Tenant B name>\`. Use realistic concrete examples for things the tester sets: \`"TEST-"\`, \`"Premium Plan"\`, \`"new_checkout"\`.

7. **Sequence tests logically.** Setup tests (e.g. "create a 2nd tenant") come before tests that depend on them. Use Pre-conditions to make dependencies explicit.

8. **Smoke-test step is acceptable** for breadth: \`Smoke: open Reports, Settings, Audit Log, Billing — confirm they load without errors after switching tenant.\`

## TONE

Terse, technical, no fluff. Read like an engineer wrote it for another engineer to execute. No "please", no "make sure to", no marketing adjectives. UI strings get quotes; everything else is bare.

## WHAT YOU WILL RECEIVE

Below this prompt the requester will paste two sections:

**APP CONTEXT** — info about the product so you can ground the tests:
- What the app does (one paragraph)
- Test personas / roles (e.g. Admin, Member, Viewer) and their test account names if any
- Any standing concepts (multi-tenant? feature flags? environments?) that recur across tests
- Module label conventions if they have an existing sheet to continue (e.g. "use PHASE 4 — ..." or "starting TC-31")

**FEATURE SCOPE** — what to generate tests for. Any of these work; pick whichever you have on hand:
- A feature spec / PRD section
- A list of tickets or PRs with brief descriptions
- A bullet list of changes shipped
- Release notes / changelog entries
- A raw \`git diff\`, PR diff, or commit-range summary (e.g. \`git log v1.4..v1.5 --oneline\` output)
- Source code of changed files (paste the actual code — read it, infer the behavior, write tests against what the code does)
- A mix of the above

When given code or a diff, treat it as the source of truth for behavior. Read what changed, infer the user-visible outcome (new UI, new validation, new branch in logic, new permission gate, new API endpoint), and write tests for the outcome — not for the code structure. If the diff touches a component the tester won't directly see (a util function, a migration), trace it to the surface where its effect is visible and test there.

Your job: derive the Module label(s), enumerate test cases that fully cover the behavior (happy path + negative paths + toggle branches + cross-surface consistency where it applies), and output the CSV.

If APP CONTEXT is missing details:
- Default Persona to the highest-privilege role that fits, or \`Admin\` if unspecified.
- Default Pre-conditions to the minimum realistic setup (e.g. \`Admin account.\`) — never write \`N/A\` or \`None\`.
- Pick a sensible Module label from the feature scope wording.

Do not invent features the input doesn't describe — but DO add the standard guard/negative-path checks that any responsible UAT plan would include for the described feature.

After the CSV, output nothing.

const parseSteps = (raw) => {
  if (!raw || typeof raw !== 'string') return [];
  const text = raw.trim();
  if (!text) return [];
  const markerRegex = /^\s*(?:\(?\d+[\.\)\:]|step\s+\d+[\.\)\:]?|[-*•])\s+/i;
  const stripMarker = (line) => line.replace(markerRegex, '').trim();
  const lines = text.split(/\n+/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return [];
  const hasAnyMarker = lines.some(l => markerRegex.test(l));
  if (!hasAnyMarker) return lines;
  const steps = [];
  for (const line of lines) {
    if (markerRegex.test(line)) {
      steps.push(stripMarker(line));
    } else if (steps.length > 0) {
      steps[steps.length - 1] += '\n' + line;
    } else {
      steps.push(line);
    }
  }
  return steps.filter(s => s.length > 0);
};

function TestCaseReviewer() {
  const [testCases, setTestCases] = useState([]);
  const [findings, setFindings] = useState({});
  const [currentIdx, setCurrentIdx] = useState(0);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('All');
  const [loaded, setLoaded] = useState(false);
  const [showExportMenu, setShowExportMenu] = useState(false);
  const [testers, setTesters] = useState([]);
  const [lastUsedTester, setLastUsedTester] = useState('');
  const [showUploadScreen, setShowUploadScreen] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [editingSteps, setEditingSteps] = useState(false);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [storageBytes, setStorageBytes] = useState(0);
  const [storageError, setStorageError] = useState(null);
  const searchInputRef = useRef(null);
  const fileInputRef = useRef(null);
  const screenshotInputRef = useRef(null);
  const pageRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const stored = await window.storage.get('test_data');
        if (stored?.value) {
          const data = JSON.parse(stored.value);
          const rehydrated = (data.testCases || []).map(tc => ({
            ...tc,
            __steps: tc.__steps && Array.isArray(tc.__steps) && tc.__steps.length > 0 ? tc.__steps : parseSteps(tc.Steps),
          }));
          setTestCases(rehydrated);
          setFindings(data.findings || {});
          setCurrentIdx(data.currentIdx || 0);
          setTesters(data.testers || []);
          setLastUsedTester(data.lastUsedTester || '');
        }
      } catch (e) {
        // No data yet
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (testCases.length === 0) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set('test_data', JSON.stringify({ testCases, findings, currentIdx, testers, lastUsedTester }));
      } catch (e) {
        console.error('Save failed', e);
      }
    }, 500);
    return () => clearTimeout(t);
  }, [testCases, findings, currentIdx, testers, lastUsedTester, loaded]);

  const handleFile = (file, testerList) => {
    if (!file) return { error: 'No file provided.' };
    return new Promise((resolve) => {
      Papa.parse(file, {
        header: true,
        dynamicTyping: false,
        skipEmptyLines: true,
        transformHeader: (h) => h.trim(),
        complete: (results) => {
          // Check parser errors
          const fatalErrors = (results.errors || []).filter(e => e.type === 'Quotes' || e.type === 'FieldMismatch' || e.code === 'UndetectableDelimiter');
          if (fatalErrors.length > 0) {
            resolve({ error: `CSV could not be parsed: ${fatalErrors[0].message || fatalErrors[0].code}. Make sure your file is a valid CSV (no markdown fences, no preamble text).` });
            return;
          }

          // Check headers
          const headers = (results.meta?.fields || []).map(h => h.trim());
          const requiredCore = ['Module', 'Test ID', 'Test Case', 'Steps'];
          const missing = requiredCore.filter(h => !headers.includes(h));
          if (missing.length > 0) {
            resolve({ error: `Missing required column(s): ${missing.join(', ')}. The first row of your CSV must contain the headers: Module, Test ID, Test Case, Persona, Steps, Expected Result, Pre-conditions, Status, Tested By, Notes.` });
            return;
          }

          // Filter rows
          const rows = results.data
            .filter(r => Object.values(r).some(v => v && String(v).trim()))
            .map((r, i) => ({
              ...r,
              __id: r['Test ID'] || `row-${i}`,
              __steps: parseSteps(r.Steps),
            }));

          if (rows.length === 0) {
            resolve({ error: 'The CSV has the correct headers but no test case rows were found. Make sure each row has data in at least the Module, Test ID, Test Case, or Steps columns.' });
            return;
          }

          // Success — apply the data
          setTestCases(rows);
          const initialFindings = {};
          rows.forEach(r => {
            const existingStatus = r.Status && String(r.Status).trim() && !['nan', 'NaN', ''].includes(String(r.Status).trim()) ? r.Status : 'Not Tested';
            const existingTestedBy = r['Tested By'] && !['nan', 'NaN'].includes(String(r['Tested By'])) ? r['Tested By'] : '';
            const existingNotes = r.Notes && !['nan', 'NaN'].includes(String(r.Notes)) ? r.Notes : '';
            initialFindings[r.__id] = makeFinding({
              status: existingStatus,
              testedBy: existingTestedBy,
              notes: existingNotes,
            });
          });
          setFindings(initialFindings);
          setTesters(testerList || []);
          setCurrentIdx(0);
          resolve({ success: true, count: rows.length });
        },
        error: (err) => {
          resolve({ error: 'Error reading CSV file: ' + err.message });
        }
      });
    });
  };

  const updateFinding = (id, key, value) => {
    setFindings(prev => ({
      ...prev,
      [id]: { ...(prev[id] || makeFinding()), [key]: value }
    }));
  };

  const updateStepNote = (id, stepIdx, value) => {
    setFindings(prev => {
      const current = prev[id] || makeFinding();
      return { ...prev, [id]: { ...current, stepNotes: { ...(current.stepNotes || {}), [stepIdx]: value } } };
    });
  };

  const toggleStepCheck = (id, stepIdx) => {
    setFindings(prev => {
      const current = prev[id] || { status: 'Not Tested', testedBy: '', notes: '', screenshots: [], stepNotes: {}, stepChecks: {} };
      const currentState = (current.stepChecks || {})[stepIdx];
      const newChecks = { ...(current.stepChecks || {}) };
      // Toggle 'done' on/off — independent of blocked
      if (currentState === 'done' || currentState === true) {
        delete newChecks[stepIdx];
      } else {
        newChecks[stepIdx] = 'done';
      }
      return { ...prev, [id]: { ...current, stepChecks: newChecks } };
    });
  };

  const handleTesterChange = (id, value) => {
    updateFinding(id, 'testedBy', value);
    if (value) setLastUsedTester(value);
  };

  // ── Step editing (add / edit / delete / reorder) ─────────────────────────

  // Mutate the current test case's steps array via a transform function.
  const mutateSteps = (fn) => {
    setTestCases(prev => prev.map((tc, i) => {
      if (i !== currentIdx) return tc;
      const next = fn([...(tc.__steps || [])]);
      return { ...tc, __steps: next, Steps: stepsToText(next) };
    }));
  };

  // Re-index per-step state when steps are inserted, deleted, or reordered.
  const remapStepState = (transform) => {
    const id = testCases[currentIdx]?.__id;
    if (!id) return;
    const remap = (obj) => {
      if (!obj) return {};
      // Convert to sparse array, transform, then back to object
      const arr = [];
      Object.keys(obj).forEach(k => {
        const n = parseInt(k, 10);
        if (!isNaN(n)) arr[n] = obj[k];
      });
      const transformed = transform(arr);
      const out = {};
      transformed.forEach((v, n) => { if (v !== undefined) out[n] = v; });
      return out;
    };
    setFindings(prev => {
      const f = prev[id];
      if (!f) return prev;
      return { ...prev, [id]: { ...f, stepChecks: remap(f.stepChecks), stepNotes: remap(f.stepNotes), stepNoteOpen: remap(f.stepNoteOpen) } };
    });
  };

  const updateStepText = (idx, text) => mutateSteps(arr => { arr[idx] = text; return arr; });

  const addStep = () => mutateSteps(arr => [...arr, '']);

  const deleteStep = (idx) => {
    mutateSteps(arr => arr.filter((_, k) => k !== idx));
    remapStepState(arr => { arr.splice(idx, 1); return arr; });
  };

  const reorderSteps = (from, to) => {
    if (from === to || from == null || to == null) return;
    mutateSteps(arr => { const [m] = arr.splice(from, 1); arr.splice(to, 0, m); return arr; });
    remapStepState(arr => { const [m] = arr.splice(from, 1); arr.splice(to, 0, m); return arr; });
  };

  useEffect(() => {
    if (testCases.length === 0) return;
    const current = testCases[currentIdx];
    if (!current) return;
    const f = findings[current.__id];
    if (f && !f.testedBy && lastUsedTester) {
      updateFinding(current.__id, 'testedBy', lastUsedTester);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentIdx, testCases.length]);

  const addScreenshots = async (id, files) => {
    const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
    const promises = fileArray.map(file => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve({ name: file.name, data: e.target.result, size: file.size, addedAt: Date.now() + Math.random() });
      reader.readAsDataURL(file);
    }));
    const newShots = await Promise.all(promises);
    setFindings(prev => {
      const current = prev[id] || makeFinding();
      return { ...prev, [id]: { ...current, screenshots: [...(current.screenshots || []), ...newShots] } };
    });
  };

  const removeScreenshot = (id, idx) => {
    setFindings(prev => {
      const current = prev[id];
      if (!current) return prev;
      return { ...prev, [id]: { ...current, screenshots: current.screenshots.filter((_, i) => i !== idx) } };
    });
  };

  useEffect(() => {
    const handlePaste = (e) => {
      if (testCases.length === 0) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      const images = [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) images.push(file);
        }
      }
      if (images.length > 0) {

                  <div className="pt-4">
                    <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                      Screenshots {currentFinding.screenshots.length > 0 && <span className="normal-case font-normal text-gray-500">({currentFinding.screenshots.length})</span>}
                    </label>
                    <div
                      onClick={() => screenshotInputRef.current?.click()}
                      onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('border-indigo-500', 'bg-indigo-950/30'); }}
                      onDragLeave={(e) => { e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-950/30'); }}
                      onDrop={(e) => {
                        e.preventDefault();
                        e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-950/30');
                        if (e.dataTransfer.files.length > 0) addScreenshots(currentCase.__id, e.dataTransfer.files);
                      }}
                      className="border-2 border-dashed border-gray-700 rounded-md p-5 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-950/20 transition-all"
                    >
                      <ImageIcon className="w-7 h-7 text-gray-500 mx-auto mb-1.5" />
                      <p className="text-sm text-gray-300">Click, drag, or paste screenshots</p>
                      <p className="text-xs text-gray-500 mt-0.5">💡 Tip: paste with Ctrl/Cmd+V</p>
                      <input
                        ref={screenshotInputRef}
                        type="file"
                        accept="image/*"
                        multiple
                        className="hidden"
                        onChange={(e) => {
                          if (e.target.files.length > 0) addScreenshots(currentCase.__id, e.target.files);
                          e.target.value = '';
                        }}
                      />
                    </div>
                    {currentFinding.screenshots.length > 0 && (
                      <div className="grid grid-cols-2 gap-3 mt-3">
                        {currentFinding.screenshots.map((shot, idx) => (
                          <div key={idx} className="relative group border border-gray-700 rounded-md overflow-hidden bg-gray-800">
                            <div className="absolute top-2 left-2 z-10 bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded shadow-md">
                              Fig. {idx + 1}
                            </div>
                            <img src={shot.data} alt={shot.name} className="w-full h-32 object-cover" />
                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/60 transition-colors flex items-center justify-center">
                              <button
                                onClick={() => removeScreenshot(currentCase.__id, idx)}
                                className="opacity-0 group-hover:opacity-100 bg-red-600 text-white p-2 rounded-full hover:bg-red-500 transition-all"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                            <div className="px-2 py-1 text-xs text-gray-400 truncate bg-gray-900 border-t border-gray-700">{shot.name}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="pt-4">
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400">Final Status</label>
                      {currentFinding.status && currentFinding.status !== 'Not Tested' && (
                        <button
                          onClick={() => updateFinding(currentCase.__id, 'status', 'Not Tested')}
                          className="text-xs text-gray-500 hover:text-red-400 transition-colors flex items-center gap-1"
                          title="Clear status"
                        >
                          <X className="w-3 h-3" />
                          Clear
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-2 gap-1.5">
                      {STATUS_OPTIONS.filter(s => s.value !== 'Not Tested').map(s => {
                        const Icon = s.icon;
                        const selected = currentFinding.status === s.value;
                        return (
                          <button
                            key={s.value}
                            onClick={() => updateFinding(currentCase.__id, 'status', s.value)}
                            className={`flex items-center justify-center gap-1 px-2 py-2 rounded-md text-xs font-medium border transition-all ${selected ? s.color + ' ring-2 ring-offset-1 ring-offset-gray-900 ring-indigo-400' : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700'}`}
                          >
                            <Icon className="w-3.5 h-3.5 flex-shrink-0" />
                            <span className="truncate">{s.value}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex justify-between pt-4">
                    <button
                      onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))}
                      disabled={currentIdx === 0}
                      className="flex items-center gap-2 px-4 py-2 bg-gray-800 border border-gray-700 text-gray-200 rounded-md hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed font-medium text-sm"
                    >
                      <ChevronLeft className="w-4 h-4" /> Previous
                    </button>
                    <button
                      onClick={() => setCurrentIdx(Math.min(testCases.length - 1, currentIdx + 1))}
                      disabled={currentIdx === testCases.length - 1}
                      className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-500 disabled:opacity-30 disabled:cursor-not-allowed font-medium text-sm"
                    >
                      Next <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {showResetConfirm && (
        <div
          className="fixed top-0 left-0 right-0 bottom-0 flex items-center justify-center p-4"
          style={{ zIndex: 99999, backgroundColor: 'rgba(0,0,0,0.75)' }}
          onClick={() => setShowResetConfirm(false)}
        >
          <div
            className="bg-gray-900 rounded-lg shadow-2xl max-w-md w-full overflow-hidden border-2 border-red-700"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="p-6">
              <div className="flex items-start gap-3 mb-4">
                <div className="flex-shrink-0 w-10 h-10 bg-red-950 rounded-full flex items-center justify-center border border-red-800">
                  <AlertCircle className="w-5 h-5 text-red-400" />
                </div>
                <div className="flex-1">
                  <h3 className="text-lg font-bold text-gray-100 mb-1">Reset all data?</h3>
                  <p className="text-sm text-gray-400">
                    This will permanently delete everything from your current session.
                  </p>
                </div>
              </div>
              <ul className="text-sm text-gray-300 space-y-1 mb-5" style={{ paddingLeft: '52px' }}>
                <li>• All {testCases.length} test cases</li>
                <li>• All findings, notes, and step checkboxes</li>
                <li>• All uploaded screenshots</li>
                <li>• Tester names ({testers.length})</li>
              </ul>
              <div className="bg-amber-950/40 border border-amber-800 rounded-md p-3 text-sm text-amber-300 mb-5">
                <strong>This cannot be undone.</strong> Consider exporting your findings first if you want to keep them.
              </div>
              <div className="flex justify-between gap-2">
                <button
                  onClick={doReset}
                  className="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-500 font-medium text-sm"
                >
                  Yes, reset everything
                </button>
                <button
                  onClick={() => setShowResetConfirm(false)}
                  className="px-4 py-2 bg-gray-800 border border-gray-700 text-gray-200 rounded-md hover:bg-gray-700 font-medium text-sm"
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Tooltip({ label, children }) {
  const [show, setShow] = useState(false);
  return (
    <div
      className="relative inline-flex"
      onMouseEnter={() => setShow(true)}
      onMouseLeave={() => setShow(false)}
    >
      {children}
      {show && (
        <div className="absolute top-full left-1/2 -translate-x-1/2 mt-1.5 px-2 py-1 bg-black text-white text-xs rounded whitespace-nowrap pointer-events-none z-50 shadow-lg border border-gray-700">
          {label}
          <div className="absolute bottom-full left-1/2 -translate-x-1/2 w-0 h-0 border-l-4 border-r-4 border-b-4 border-transparent border-b-black" />
        </div>
      )}
    </div>
  );
}

function UploadScreen({ onLoad, fileInputRef, hasExistingData, onBack, existingTesters }) {
  const [testerInput, setTesterInput] = useState('');
  const [testerList, setTesterList] = useState(existingTesters || []);
  const [pendingFile, setPendingFile] = useState(null);
  const [promptCopied, setPromptCopied] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState(null);

  const copyPrompt = async () => {
    let ok = false;
    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(CSV_GENERATION_PROMPT);
        ok = true;
      }
    } catch (e) {
      console.warn('Clipboard API failed, falling back:', e);
    }
    if (!ok) {
      // Fallback for sandboxed iframes / older browsers
      try {
        const ta = document.createElement('textarea');
        ta.value = CSV_GENERATION_PROMPT;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {
        console.error('Fallback copy failed:', e);
      }
    }
    if (ok) {
      setPromptCopied(true);
      setTimeout(() => setPromptCopied(false), 2500);
    } else {
      alert('Could not copy automatically. The prompt has been logged to the browser console — open DevTools to grab it.');
      console.log('CSV_GENERATION_PROMPT:\n\n' + CSV_GENERATION_PROMPT);
    }
  };

  const addTester = () => {
    const raw = testerInput.trim();
    if (!raw) return;
    const names = raw.split(',').map(n => n.trim()).filter(n => n.length > 0);
    const newOnes = names.filter(n => !testerList.includes(n));
    if (newOnes.length > 0) setTesterList([...testerList, ...newOnes]);
    setTesterInput('');
  };

  const removeTester = (name) => {
    setTesterList(testerList.filter(t => t !== name));
  };

  const setFile = (file) => {
    setPendingFile(file);
    setUploadError(null);
  };

  const proceed = async () => {
    if (!pendingFile || uploading) return;
    setUploading(true);
    setUploadError(null);
    const result = await onLoad(pendingFile, testerList);
    setUploading(false);
    if (result?.error) {
      setUploadError(result.error);
    }
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950 flex items-center justify-center p-6">
      <style>{`
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 5px; border: 2px solid #0a0a0f; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a48; }
        ::-webkit-scrollbar-corner { background: #0a0a0f; }
        * { scrollbar-color: #2a2a35 #0a0a0f; scrollbar-width: thin; }
      `}</style>
      <div className="max-w-2xl w-full">
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4 shadow-lg shadow-indigo-900/50">
            <FileText className="w-8 h-8 text-white" />
          </div>
          <h1 className="text-3xl font-bold text-gray-100 mb-2">Test Case Report Compiler</h1>
        </div>

        {hasExistingData && (
          <div className="bg-amber-950/40 border border-amber-800 rounded-lg p-3 mb-4 text-sm text-amber-300">
            <strong>Heads up:</strong> Uploading a new CSV will replace your current test cases and findings. Use the button below to return to your session.
          </div>
        )}

        <div
          onClick={() => !pendingFile && fileInputRef.current?.click()}
          onDragOver={(e) => { e.preventDefault(); if (!pendingFile) e.currentTarget.classList.add('border-indigo-500', 'bg-indigo-950/30'); }}
          onDragLeave={(e) => { e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-950/30'); }}
          onDrop={(e) => {
            e.preventDefault();
            e.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-950/30');
            if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
          }}
          className={`bg-gray-900 border-2 border-dashed rounded-2xl p-10 text-center transition-all shadow-sm mb-4 ${pendingFile ? (uploadError ? 'border-red-600 bg-red-950/20' : 'border-green-600 bg-green-950/20') : 'border-gray-700 cursor-pointer hover:border-indigo-500 hover:bg-indigo-950/20'}`}
        >
          {pendingFile ? (
            <>
              {uploadError ? (
                <AlertCircle className="w-12 h-12 text-red-500 mx-auto mb-3" />
              ) : (
                <CheckCircle2 className="w-12 h-12 text-green-500 mx-auto mb-3" />
              )}
              <p className="text-lg font-medium text-gray-100 mb-1">{pendingFile.name}</p>
              <p className="text-sm text-gray-400 mb-4">{(pendingFile.size / 1024).toFixed(1)} KB</p>
              {uploadError && (
                <div className="bg-red-950/60 border border-red-700 rounded-md p-3 mb-4 text-sm text-red-200 text-left">
                  <div className="flex items-start gap-2">
                    <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                    <div>
                      <strong className="font-semibold">Couldn't load this CSV</strong>
                      <div className="mt-1 opacity-90">{uploadError}</div>
                    </div>
                  </div>
                </div>
              )}
              <div className="flex gap-2 justify-center">
                <button
                  onClick={(e) => { e.stopPropagation(); setFile(null); }}
                  className="px-4 py-2 bg-gray-800 border border-gray-700 text-gray-200 rounded-md hover:bg-gray-700 text-sm font-medium"
                  disabled={uploading}
                >
                  Choose different file
                </button>
                {!uploadError && (
                  <button
                    onClick={(e) => { e.stopPropagation(); proceed(); }}
                    className="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-500 text-sm font-medium disabled:opacity-60 disabled:cursor-not-allowed"
                    disabled={uploading}
                  >
                    {uploading ? 'Loading…' : 'Start Testing →'}
                  </button>
                )}
              </div>
            </>
          ) : (
            <>
              <Upload className="w-12 h-12 text-gray-500 mx-auto mb-3" />
              <p className="text-lg font-medium text-gray-200 mb-1">Drop your CSV file here</p>
              <p className="text-sm text-gray-400">or click to browse</p>
              <input
                ref={fileInputRef}
                type="file"
                accept=".csv"
                className="hidden"
                onChange={(e) => setFile(e.target.files[0])}
              />
            </>
          )}
        </div>

        <div className="text-xs text-gray-500 text-center mb-4">
          Expected columns: Module, Test ID, Test Case, Persona, Steps, Expected Result, Pre-conditions, Status, Tested By, Notes
        </div>

        <div className="text-center mb-4">
          <button
            onClick={copyPrompt}
            className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium border transition-all ${promptCopied ? 'bg-green-950/40 border-green-700 text-green-300' : 'bg-gray-900 border-gray-700 text-gray-400 hover:text-indigo-300 hover:border-indigo-700 hover:bg-indigo-950/30'}`}
            title="Copy a prompt you can paste into Claude or ChatGPT to generate a CSV that fits this app"
          >
            {promptCopied ? (
              <>
                <CheckCircle2 className="w-3.5 h-3.5" />
                Prompt copied — paste into Claude/ChatGPT
              </>
            ) : (
              <>
                <FileText className="w-3.5 h-3.5" />
                Don't have a CSV? Copy AI prompt to generate one
              </>
            )}
          </button>
        </div>

        {hasExistingData && (
          <button
            onClick={onBack}
            className="w-full mb-4 flex items-center justify-center gap-2 px-4 py-3 bg-gray-900 border-2 border-indigo-700 text-indigo-300 rounded-lg hover:bg-indigo-950/40 hover:border-indigo-500 transition-all font-semibold shadow-sm"
          >
            <ChevronLeft className="w-5 h-5" />
            Back to current session
          </button>
        )}

        <div className="bg-gray-900 rounded-xl p-6 border border-gray-800 shadow-sm mb-4">
          <div className="flex items-center gap-2 mb-3">
            <Users className="w-5 h-5 text-indigo-400" />
            <h2 className="font-semibold text-gray-100">Tester Names <span className="text-sm font-normal text-gray-400">(optional)</span></h2>
          </div>
          <p className="text-sm text-gray-400 mb-3">Add one or more tester names. You'll be able to pick from this list on each test case page.</p>
          <div className="flex gap-2 mb-3">
            <input
              type="text"
              value={testerInput}
              onChange={(e) => setTesterInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTester(); } }}
              placeholder="Enter name(s), comma-separated (e.g. Alice, Bob, Carol)"
              className="flex-1 px-3 py-2 bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            />
            <button
              onClick={addTester}
              disabled={!testerInput.trim()}
              className="flex items-center gap-1 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-sm"
            >
              <Plus className="w-4 h-4" /> Add
            </button>
          </div>
          {testerList.length > 0 && (
            <div className="flex flex-wrap gap-2">
              {testerList.map(name => (
                <span key={name} className="inline-flex items-center gap-1.5 bg-indigo-950/60 text-indigo-300 px-3 py-1 rounded-full text-sm font-medium border border-indigo-800">
                  {name}
                  <button onClick={() => removeTester(name)} className="hover:bg-indigo-800 rounded-full p-0.5">
                    <X className="w-3 h-3" />
                  </button>
                </span>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, highlight }) {
  return (
    <div>
      <div className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">{label}</div>
      <div className={`text-sm whitespace-pre-wrap ${highlight ? 'bg-amber-950/30 border-l-4 border-amber-500 px-3 py-2 rounded text-amber-100' : 'text-gray-200'}`}>
        {value}
      </div>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<TestCaseReviewer />);
  </script>
</body>
</html>
